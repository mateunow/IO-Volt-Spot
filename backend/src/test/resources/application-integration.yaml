spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ocm:
  api:
    key: test-key

logging:
  level:
    org.flywaydb: WARN
    org.springframework.web.client.RestClient: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
